[package]
name = "inkstone"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native infinite-canvas notebook for Linux and Android"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:adw", "dep:cairo-rs", "dep:gdk-pixbuf", "dep:gtk4"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"], optional = true }
base64 = "0.23.1"
cairo-rs = { version = "0.22.9", features = ["pdf", "png"], optional = true }
gdk-pixbuf = { version = "0.22.0", optional = true }
gtk4 = { version = "0.11.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "inkstone"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "gui_smoke"
path = "tests/gui_smoke.rs"
required-features = ["desktop"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
